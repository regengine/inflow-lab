[project]
name = "regengine-codex-workspace"
version = "0.1.0"
description = "Mock-first FSMA 204 inflow simulator for RegEngine-compatible payloads"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "bandit>=1.7.10",
  "pip-audit>=2.7.0",
]
browser = [
  "playwright>=1.58.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# #137 assessment: ruff's own default rule selection (pyflakes plus the
# core pycodestyle error checks) is the one slice of its full rule
# surface that is already near-zero-cost on this codebase today -- 8
# findings total across app/scripts/tests: 3 module-import-not-at-top
# and 1 loop-shadowed import in scripts/ (all deliberate sys.path shims
# or local rebinds), 1 unused variable in scripts/, and 3 F401s in
# app/main.py that are NOT actually dead -- they are re-exports the test
# suite imports through app.main, and deleting them breaks collection in
# 11 modules (verified). Those three want an __all__ or a per-file
# ignore, not a fix. Pinned explicitly
# here rather than left as ruff's implicit default, so a future ruff
# version changing its default select can't silently change what this
# enforces.
#
# Broader rule families were evaluated and found to need a real cleanup
# pass first, not a config flip: docstring coverage (D, ~800 findings --
# this codebase documents "why" via inline comments instead, per its own
# convention) and type-annotation completeness (ANN, ~450 findings) are
# both sizeable standalone efforts; flake8-bandit's S mostly duplicates
# the security-focused `bandit` step this project's CI already runs
# separately, and its single largest contributor (S101, ~1300 hits) is
# just `assert` in tests/, which is how this suite is written throughout.
# A handful of narrower additions (isort's I, pyupgrade's UP, bugbear's B
# once FastAPI's Depends()-in-defaults pattern is allow-listed,
# comprehensions' C4, ruff-native RUF) are close to adoptable too, but
# line-length alone goes from 8 findings to ~170 at ruff's 88-char
# default versus this codebase's actual ~110-120 char lines, so that
# batch needs an explicit line-length choice plus a small manual cleanup
# pass first. See issue #137 for the full counts.
#
# This section does not add CI enforcement by itself -- no workflow step
# runs `ruff check` yet.
select = ["E4", "E7", "E9", "F"]
