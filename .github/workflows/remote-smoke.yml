name: Remote Smoke

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed shared-demo base URL
        required: false
        type: string
        default: https://regengine-inflow-lab-gh-production.up.railway.app
      tenant:
        description: Tenant used for isolated remote smoke data
        required: false
        type: string
        default: remote-smoke

permissions:
  contents: read

concurrency:
  group: remote-smoke-${{ github.event.inputs.base_url || 'https://regengine-inflow-lab-gh-production.up.railway.app' }}-${{ github.event.inputs.tenant || 'remote-smoke-nightly' }}
  cancel-in-progress: false

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Validate remote smoke secrets
        env:
          REGENGINE_REMOTE_USERNAME: ${{ secrets.REGENGINE_REMOTE_USERNAME }}
          REGENGINE_REMOTE_PASSWORD: ${{ secrets.REGENGINE_REMOTE_PASSWORD }}
        run: |
          test -n "$REGENGINE_REMOTE_USERNAME" || { echo "REGENGINE_REMOTE_USERNAME secret is required"; exit 1; }
          test -n "$REGENGINE_REMOTE_PASSWORD" || { echo "REGENGINE_REMOTE_PASSWORD secret is required"; exit 1; }

      - name: Run remote smoke
        env:
          REGENGINE_REMOTE_BASE_URL: ${{ github.event.inputs.base_url || 'https://regengine-inflow-lab-gh-production.up.railway.app' }}
          REGENGINE_REMOTE_USERNAME: ${{ secrets.REGENGINE_REMOTE_USERNAME }}
          REGENGINE_REMOTE_PASSWORD: ${{ secrets.REGENGINE_REMOTE_PASSWORD }}
          REGENGINE_REMOTE_TENANT: ${{ github.event.inputs.tenant || 'remote-smoke-nightly' }}
          REGENGINE_EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: uv run --frozen --no-dev python scripts/remote_smoke.py

  # A red scheduled run is invisible; a filed issue is not. See
  # .github/workflows/smoke-failure-issue.yml.
  report-failure:
    needs: remote-smoke
    if: failure()
    uses: ./.github/workflows/smoke-failure-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      smoke_name: Remote Smoke
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The other edge. Without it the tracker's open/closed state carries no
  # information about whether the demo is broken *now*, and the next real
  # outage lands as a comment on a stale thread instead of a new issue.
  report-recovery:
    needs: remote-smoke
    if: success()
    uses: ./.github/workflows/smoke-failure-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      smoke_name: Remote Smoke
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      resolved: true
