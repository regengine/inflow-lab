name: Contract Pin Drift

# #104 -- neither side of the inflow-lab <-> RegEngine ingest contract is
# tested against the other's current code by default. Each repository
# names a commit in the other, and a pin nobody advances is worse than no
# pin at all: it goes on reporting green about code that shipped weeks
# ago.
#
# Two pins, watched in both directions:
#
#   1. RegEngine's .github/workflows/inflow-contract-ci.yml pins
#      INFLOW_LAB_REF -- the simulator commit its contract test actually
#      runs. That is the pin #104 was filed about: it sat far enough
#      behind main that the controller-side verdict-pairing rewrite (#85)
#      had never run against a real RegEngine. Only RegEngine maintainers
#      can advance it, so on pull requests here it is REPORTED (annotation
#      plus job summary) and on the scheduled run it FAILS and files an
#      issue, which is where someone who can act on it will see it.
#
#   2. The RegEngine ref this trusted cross-repo workflow verifies. It
#      defaults to RegEngine's resolved default branch -- this side tracks
#      upstream rather than pinning it, so there is normally
#      nothing to drift. It only becomes a pin when a maintainer sets the
#      REGENGINE_CONTRACT_REF variable to a SHA to ride out an upstream
#      breakage, and then this check FAILS once that workaround goes
#      stale, in every event type, because this repository can fix it.
#
# Why N = 10 commits, and why a commit count is only half the test:
# inflow-lab's main branch has averaged roughly one commit every two days
# (75 commits over its first four months; 15 in the last 30 days), so ten
# commits is about three weeks -- long enough to absorb an ordinary review
# and release cycle without nagging, short enough that a pin cannot go a
# quarter stale unnoticed. It is denominated in commits rather than days
# because the pin is a commit; it is the same intent as the 90-day
# staleness window in app/contract.py, measured in the unit that actually
# moves.
#
# The count alone would have been too weak to catch #104 (the pin was
# ~11 commits behind, right at any plausible threshold). What made that
# pin dangerous was WHICH commits it missed, so scripts/contract_pin_drift.py
# also fails on a single commit touching the contract surface, whatever
# the count -- and treats a truncated GitHub compare response as drifted
# rather than assuming it is clean.
#
# Requires read access to RegEngine:
# secrets.REGENGINE_CONTRACT_REPO_TOKEN (preferred, legacy-compatible here),
# or secrets.REGENGINE_CONTRACT_TOKEN
# (both: contents: read on regengine/regengine),
# or vars.REGENGINE_CONTRACT_PUBLIC=true if that repository is public.
# Pull-request metadata runs execute only the trusted base revision and may
# report access outages without blocking. Scheduled and maintainer-triggered
# repository-dispatch runs fail when access is absent or verification cannot
# complete. Unlike workflow_dispatch, repository_dispatch always loads this
# credential-bearing workflow from the default branch.

on:
  # This credential-bearing workflow must come from the trusted base branch.
  # It never checks out, imports, installs or executes pull-request code or
  # artifacts. Ordinary candidate behavior remains covered by ci.yml.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 8 * * 1'
  repository_dispatch:
    types: [contract-pin-drift]

permissions:
  contents: read

concurrency:
  group: contract-pin-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MAX_PIN_DRIFT_COMMITS: '10'

jobs:
  drift:
    name: Cross-repo pin drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checked: ${{ steps.complete.outputs.checked }}

    steps:
      - name: Check out trusted repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always use the repository's trusted default branch, never a PR
          # head/base branch or an operator-selected dispatch ref.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Resolve RegEngine access and ref
        id: access
        env:
          # The `secrets` context is unavailable in step-level `if:`, so
          # presence has to become a step output first.
          REGENGINE_CONTRACT_TOKEN: ${{ secrets.REGENGINE_CONTRACT_TOKEN || secrets.REGENGINE_CONTRACT_REPO_TOKEN }}
          REGENGINE_CONTRACT_PUBLIC: ${{ vars.REGENGINE_CONTRACT_PUBLIC }}
          REGENGINE_CONTRACT_REPOSITORY: ${{ vars.REGENGINE_CONTRACT_REPOSITORY }}
          REGENGINE_CONTRACT_REF: ${{ vars.REGENGINE_CONTRACT_REF }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          repository="${REGENGINE_CONTRACT_REPOSITORY:-regengine/regengine}"
          ref="${REGENGINE_CONTRACT_REF:-}"

          if ! [[ "${repository}" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] \
              || [[ "${repository}" == *..* ]]; then
            echo "::error::Invalid REGENGINE_CONTRACT_REPOSITORY; expected one GitHub owner/name pair."
            exit 1
          fi
          if [ -n "${ref}" ] && { \
              ! [[ "${ref}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$ ]] \
              || [[ "${ref}" == *..* ]] \
              || [[ "${ref}" == *//* ]] \
              || [[ "${ref}" == */ ]] \
              || [[ "${ref}" == *'@{'* ]]; \
          }; then
            echo "::error::Invalid REGENGINE_CONTRACT_REF; expected a safe branch name or full commit SHA."
            exit 1
          fi

          # Whether an inability to reach the other repository (a revoked
          # token, a deleted commit, an API outage) is fatal. On a pull
          # request it is not: none of those are the contributor's to fix,
          # and a check that reddens for them gets ignored for the ones
          # that matter. The scheduled run treats them as failures.
          if [ "${EVENT_NAME}" = "pull_request_target" ]; then
            enforce=false
          else
            enforce=true
          fi

          if [ -n "${REGENGINE_CONTRACT_TOKEN:-}" ] || [ "${REGENGINE_CONTRACT_PUBLIC:-}" = "true" ]; then
            has_access=true
          else
            has_access=false
            echo "::warning::Cross-repo pin drift NOT checked: add the repository secret REGENGINE_CONTRACT_REPO_TOKEN (or REGENGINE_CONTRACT_TOKEN), with contents:read on regengine/regengine, or set the repository variable REGENGINE_CONTRACT_PUBLIC=true if that repository is public."
            {
              echo "### Contract pin drift: NOT CHECKED"
              echo
              echo "No cross-repo access is configured for this run, so neither pin was compared."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "has_access=${has_access}"
            echo "enforce=${enforce}"
            echo "regengine_repository=${repository}"
            echo "regengine_ref=${ref}"
          } >> "$GITHUB_OUTPUT"

          if [ "${has_access}" != "true" ] && [ "${enforce}" = "true" ]; then
            echo "::error::Scheduled/repository-dispatch contract verification is enforced and cannot succeed as NOT CHECKED."
            exit 1
          fi

      - name: Resolve immutable RegEngine refs
        id: regengine_ref
        if: steps.access.outputs.has_access == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGENGINE_CONTRACT_TOKEN || secrets.REGENGINE_CONTRACT_REPO_TOKEN || github.token }}
          REGENGINE_REPOSITORY: ${{ steps.access.outputs.regengine_repository }}
          REQUESTED_REF: ${{ steps.access.outputs.regengine_ref }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          unavailable() {
            if [ "${ENFORCE}" = "true" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }

          if ! default_branch="$(gh api "repos/${REGENGINE_REPOSITORY}" --jq .default_branch)"; then
            unavailable "Could not read ${REGENGINE_REPOSITORY} repository metadata; contract verification did not run."
          fi
          if ! [[ "${default_branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$ ]] \
              || [[ "${default_branch}" == *..* ]] \
              || [[ "${default_branch}" == *//* ]] \
              || [[ "${default_branch}" == */ ]] \
              || [[ "${default_branch}" == *'@{'* ]]; then
            unavailable "${REGENGINE_REPOSITORY} returned an invalid default branch name."
          fi

          requested="${REQUESTED_REF:-${default_branch}}"
          if [ "${requested}" = "${default_branch}" ]; then
            tracking=true
          elif [[ "${requested}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            tracking=false
          else
            unavailable "REGENGINE_CONTRACT_REF must be empty/the current default branch for tracking, or one full 40-character commit SHA."
          fi

          if ! default_sha="$(gh api --method GET "repos/${REGENGINE_REPOSITORY}/commits" \
              -f sha="${default_branch}" -f per_page=1 --jq '.[0].sha')" \
              || ! [[ "${default_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            unavailable "Could not resolve ${REGENGINE_REPOSITORY}'s default branch to an immutable commit."
          fi
          if ! resolved_sha="$(gh api --method GET "repos/${REGENGINE_REPOSITORY}/commits" \
              -f sha="${requested}" -f per_page=1 --jq '.[0].sha')" \
              || ! [[ "${resolved_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            unavailable "Could not resolve REGENGINE_CONTRACT_REF in the configured RegEngine repository."
          fi
          if [ "${tracking}" = "false" ] && [ "${resolved_sha,,}" != "${requested,,}" ]; then
            unavailable "REGENGINE_CONTRACT_REF did not resolve to the exact configured commit SHA."
          fi

          {
            echo "completed=true"
            echo "repository=${REGENGINE_REPOSITORY}"
            echo "requested=${requested}"
            echo "sha=${resolved_sha}"
            echo "default_branch=${default_branch}"
            echo "default_sha=${default_sha}"
            echo "tracking=${tracking}"
          } >> "$GITHUB_OUTPUT"
          echo "RegEngine ref ${requested} resolves to ${resolved_sha}; default ${default_branch} resolves to ${default_sha}."

      # Direction 1: the simulator commit RegEngine's contract test pins.
      - name: Fetch RegEngine's trusted contract workflow
        id: upstream_workflow
        if: steps.regengine_ref.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGENGINE_CONTRACT_TOKEN || secrets.REGENGINE_CONTRACT_REPO_TOKEN || github.token }}
          REGENGINE_REPOSITORY: ${{ steps.regengine_ref.outputs.repository }}
          REGENGINE_DEFAULT_SHA: ${{ steps.regengine_ref.outputs.default_sha }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          unreachable() {
            if [ "${ENFORCE}" = "true" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }

          if ! gh api --method GET \
              "repos/${REGENGINE_REPOSITORY}/contents/.github/workflows/inflow-contract-ci.yml" \
              -f ref="${REGENGINE_DEFAULT_SHA}" \
              -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/inflow-contract-ci.yml"; then
            unreachable "Could not read ${REGENGINE_REPOSITORY}'s inflow-contract-ci.yml; the pin it holds on this repository was not checked."
          fi
          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Read the simulator ref RegEngine pins
        id: upstream_pin
        if: steps.upstream_workflow.outputs.completed == 'true'
        env:
          REGENGINE_REPOSITORY: ${{ steps.regengine_ref.outputs.repository }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          unreachable() {
            if [ "${ENFORCE}" = "true" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }

          # Parsed by the tested helper rather than an inline regex: if
          # upstream renames or moves the pin this exits non-zero, which
          # is itself the news this job exists to deliver.
          # stderr is captured rather than inherited so its ::error::
          # annotation does not surface on a pull request the warning path
          # deliberately lets pass.
          if ! pin="$(python scripts/contract_pin_drift.py pinned-ref \
              --workflow "${RUNNER_TEMP}/inflow-contract-ci.yml" 2> "${RUNNER_TEMP}/pinned-ref.err")"; then
            sed 's/^::error:://' "${RUNNER_TEMP}/pinned-ref.err"
            unreachable "${REGENGINE_REPOSITORY} no longer pins INFLOW_LAB_REF where this check looks for it; the pin was not checked."
          fi

          {
            echo "completed=true"
            echo "pin=${pin}"
          } >> "$GITHUB_OUTPUT"
          echo "RegEngine pins this repository at ${pin}"

      - name: Fetch comparison for RegEngine's simulator pin
        id: simulator_comparison
        if: steps.upstream_pin.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.upstream_pin.outputs.pin }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          unavailable() {
            if [ "${ENFORCE}" = "true" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }

          if ! default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"; then
            unavailable "Could not resolve this repository's default branch."
          fi
          if ! [[ "${default_branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$ ]]; then
            unavailable "This repository returned an invalid default branch name."
          fi
          if ! head_sha="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits" \
              -f sha="${default_branch}" -f per_page=1 --jq '.[0].sha')" \
              || ! [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            unavailable "Could not resolve this repository's default branch to an immutable commit."
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/compare/${PIN}...${head_sha}" \
              > "${RUNNER_TEMP}/inflow-comparison.json"; then
            unavailable "Could not compare RegEngine's simulator pin to this repository's default-branch commit."
          fi

          {
            echo "completed=true"
            echo "head_sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Check drift of RegEngine's simulator pin
        id: simulator_drift
        if: steps.simulator_comparison.outputs.completed == 'true'
        env:
          PIN: ${{ steps.upstream_pin.outputs.pin }}
          HEAD_SHA: ${{ steps.simulator_comparison.outputs.head_sha }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          # A pull request here cannot advance a pin that lives in the
          # other repository, so blocking one on it would only train
          # people to ignore the check. The scheduled run enforces it and
          # files an issue for someone who can act.
          if [ "${ENFORCE}" = "true" ]; then
            on_breach=fail
          else
            on_breach=warn
          fi

          set +e
          python scripts/contract_pin_drift.py check \
            --comparison "${RUNNER_TEMP}/inflow-comparison.json" \
            --label "RegEngine's INFLOW_LAB_REF pin on this repository" \
            --base-ref "${PIN}" \
            --head-ref "${HEAD_SHA}" \
            --max-commits "${MAX_PIN_DRIFT_COMMITS}" \
            --surface-preset inflow-lab \
            --on-breach "${on_breach}"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${ENFORCE}" != "true" ] && [ "${status}" -eq 3 ]; then
            echo "::warning::The simulator-pin comparison was malformed; this pull-request metadata run is NOT CHECKED."
            exit 0
          fi
          exit "${status}"

      # Direction 2: the RegEngine ref this repository's contract job uses.
      - name: Fetch comparison for this repository's RegEngine ref
        id: regengine_comparison
        if: steps.regengine_ref.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGENGINE_CONTRACT_TOKEN || secrets.REGENGINE_CONTRACT_REPO_TOKEN || github.token }}
          REGENGINE_REPOSITORY: ${{ steps.regengine_ref.outputs.repository }}
          REGENGINE_SHA: ${{ steps.regengine_ref.outputs.sha }}
          DEFAULT_SHA: ${{ steps.regengine_ref.outputs.default_sha }}
          TRACKING: ${{ steps.regengine_ref.outputs.tracking }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          unavailable() {
            if [ "${ENFORCE}" = "true" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }

          if [ "${TRACKING}" = "true" ]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/${REGENGINE_REPOSITORY}/compare/${REGENGINE_SHA}...${DEFAULT_SHA}" \
              > "${RUNNER_TEMP}/regengine-comparison.json"; then
            unavailable "Could not compare the configured RegEngine pin to its default-branch commit."
          fi
          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Check drift of this repository's RegEngine ref
        id: regengine_drift
        if: steps.regengine_comparison.outputs.completed == 'true'
        env:
          REGENGINE_REPOSITORY: ${{ steps.regengine_ref.outputs.repository }}
          REGENGINE_REF: ${{ steps.regengine_ref.outputs.requested }}
          REGENGINE_SHA: ${{ steps.regengine_ref.outputs.sha }}
          DEFAULT_SHA: ${{ steps.regengine_ref.outputs.default_sha }}
          TRACKING: ${{ steps.regengine_ref.outputs.tracking }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          if [ "${TRACKING}" = "true" ]; then
            echo "::notice::This repository tracks ${REGENGINE_REPOSITORY} at resolved commit ${REGENGINE_SHA}; there is no pinned commit to drift."
            {
              echo "### Contract pin drift: this repository's RegEngine ref"
              echo
              echo "Tracking the default branch at immutable commit \`${REGENGINE_SHA}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This pin lives here, so a failure is actionable here: clear
          # REGENGINE_CONTRACT_REF to go back to tracking, or move it
          # forward.
          set +e
          python scripts/contract_pin_drift.py check \
            --comparison "${RUNNER_TEMP}/regengine-comparison.json" \
            --label "this repository's REGENGINE_CONTRACT_REF pin" \
            --base-ref "${REGENGINE_SHA}" \
            --head-ref "${DEFAULT_SHA}" \
            --max-commits "${MAX_PIN_DRIFT_COMMITS}" \
            --surface-preset regengine \
            --on-breach fail
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${ENFORCE}" != "true" ] && [ "${status}" -eq 3 ]; then
            echo "::warning::The RegEngine-pin comparison was malformed; this pull-request metadata run is NOT CHECKED."
            exit 0
          fi
          exit "${status}"

      - name: Fetch RegEngine contract source at the resolved commit
        id: contract_source
        if: steps.regengine_ref.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGENGINE_CONTRACT_TOKEN || secrets.REGENGINE_CONTRACT_REPO_TOKEN || github.token }}
          REGENGINE_REPOSITORY: ${{ steps.regengine_ref.outputs.repository }}
          REGENGINE_SHA: ${{ steps.regengine_ref.outputs.sha }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          unavailable() {
            if [ "${ENFORCE}" = "true" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }

          source_root="${RUNNER_TEMP}/regengine-contract-source"
          source_dir="${source_root}/services/ingestion/app"
          mkdir -p "${source_dir}"
          if ! gh api --method GET \
              "repos/${REGENGINE_REPOSITORY}/contents/services/ingestion/app/webhook_models.py" \
              -f ref="${REGENGINE_SHA}" \
              -H "Accept: application/vnd.github.raw" > "${source_dir}/webhook_models.py"; then
            unavailable "Could not fetch RegEngine's webhook contract source at the resolved immutable commit."
          fi
          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Verify real RegEngine KDE table and contract version
        id: contract_provenance
        if: steps.contract_source.outputs.completed == 'true'
        env:
          REGENGINE_SHA: ${{ steps.regengine_ref.outputs.sha }}
          ENFORCE: ${{ steps.access.outputs.enforce }}
        run: |
          set -euo pipefail
          echo "completed=false" >> "$GITHUB_OUTPUT"

          set +e
          python scripts/regengine_kde_contract.py verify \
            --regengine-root "${RUNNER_TEMP}/regengine-contract-source" \
            --inflow-contract app/contract.py \
            > "${RUNNER_TEMP}/contract-verify.out" \
            2> "${RUNNER_TEMP}/contract-verify.err"
          status=$?
          set -e

          if [ "${status}" -eq 0 ]; then
            cat "${RUNNER_TEMP}/contract-verify.out"
            echo "Verified RegEngine source commit ${REGENGINE_SHA}"
            {
              echo "### Real RegEngine contract provenance -- VERIFIED"
              echo
              echo "Verified RegEngine source commit \`${REGENGINE_SHA}\` against the snapshot's exact source-byte SHA-256 before AST extraction; no upstream code was imported or executed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${status}" -eq 2 ] && [ "${ENFORCE}" != "true" ]; then
            sed 's/^::error:://' "${RUNNER_TEMP}/contract-verify.err"
            echo "::warning::RegEngine's contract differs from the trusted base revision; scheduled/repository-dispatch verification enforces this mismatch."
            echo "completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${status}" -eq 3 ] && [ "${ENFORCE}" != "true" ]; then
            sed 's/^::error:://' "${RUNNER_TEMP}/contract-verify.err"
            echo "::warning::RegEngine contract source could not be parsed; this pull-request metadata run is NOT CHECKED."
            exit 0
          fi

          cat "${RUNNER_TEMP}/contract-verify.err" >&2
          exit "${status}"

      - name: Mark complete contract verification
        id: complete
        if: >-
          steps.simulator_drift.outputs.completed == 'true' &&
          steps.regengine_drift.outputs.completed == 'true' &&
          steps.contract_provenance.outputs.completed == 'true'
        run: echo "checked=true" >> "$GITHUB_OUTPUT"

  # A red scheduled run is invisible; a filed issue is not. Same reasoning
  # and same reusable workflow as the smoke checks.
  report-failure:
    needs: drift
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/smoke-failure-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      smoke_name: Contract Pin Drift
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The other edge, so the tracker's open/closed state says whether the
  # pins are stale *now*. Only meaningful when the pins were actually
  # compared, hence the `checked` guard.
  report-recovery:
    needs: drift
    if: success() && github.event_name == 'schedule' && needs.drift.outputs.checked == 'true'
    uses: ./.github/workflows/smoke-failure-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      smoke_name: Contract Pin Drift
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      resolved: true
