name: Codex Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 1-5'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: codex-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run baseline tests
        run: uv run --frozen --group dev pytest

      - name: Validate Codex Autopilot secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret is required for Codex Autopilot"; exit 1; }

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/autobuild.md
          output-file: /tmp/codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Explain Codex Action failure
        if: failure() && steps.run_codex.outcome == 'failure'
        run: |
          echo "::error::Codex Action failed before producing an output file. Confirm OPENAI_API_KEY is valid, then inspect the uploaded Codex artifact and action logs."
          exit 1

      - name: Run post-change tests
        run: uv run --frozen --group dev pytest

      - name: Write workflow summary
        if: always()
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          {
            echo '## Codex final message'
            echo
            printf '%s\n' "$CODEX_FINAL_MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture patch artifact
        if: always()
        run: |
          git status --short
          git diff --binary > /tmp/codex.diff || true

      - name: Upload Codex artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-autopilot-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            /tmp/codex-output.md
            /tmp/codex.diff

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CODEX_PR_TOKEN || github.token }}
          commit-message: 'chore(codex): autopilot maintenance'
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: codex/autopilot
          delete-branch: true
          title: '[Codex] Autopilot maintenance'
          body: |
            This pull request was opened automatically by the Codex autopilot workflow.

            - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Prompt file: `.github/codex/prompts/autobuild.md`
            - Guidance files: `AGENTS.md` and `.agents/skills/regengine-api-contract/SKILL.md`
            - Transcript + patch: download the workflow artifact from this run
            - Merge policy: this workflow only opens or updates a PR. A human review
              and required status checks must land the change.
          # NOTE: .github/workflows/** is intentionally NOT listed here. This
          # job holds contents:write and pull-requests:write, and the Codex
          # step runs unsupervised with workspace-write access, so it could
          # in principle edit a workflow file (e.g. loosen these very
          # permissions, add a trigger, or touch secrets usage). add-paths
          # is a git-pathspec allowlist: only paths listed below are ever
          # `git add`-ed before this action commits and opens the PR, so any
          # in-workspace edit to .github/workflows/** simply never gets
          # staged, never gets committed, and evaporates with the ephemeral
          # runner at the end of the job. It cannot land in the auto-PR even
          # silently. See issue #128. If a workflow genuinely needs to
          # change, that must go through a human-authored PR instead — which
          # is also why .github/CODEOWNERS requires review on .github/**.
          #
          # Only .github/codex/prompts/** is allowed back in under .github/
          # (the autopilot's own prompt file lives there today). Add other
          # specific non-workflow .github/ paths here individually if they
          # come up — do not widen this back to a bare `.github/**`.
          add-paths: |
            .github/codex/prompts/**
            .agents/**
            .codex/**
            AGENTS.md
            AUTOPILOT_TASKS.md
            PROMPT_FOR_CODEX.md
            README.md
            app/**
            tests/**
            pyproject.toml
            uv.lock
