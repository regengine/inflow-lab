name: Codex Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 1-5'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: codex-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run baseline tests
        run: uv run --frozen --group dev pytest

      - name: Validate Codex Autopilot secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret is required for Codex Autopilot"; exit 1; }

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/autobuild.md
          output-file: /tmp/codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Explain Codex Action failure
        if: failure() && steps.run_codex.outcome == 'failure'
        run: |
          echo "::error::Codex Action failed before producing an output file. Confirm OPENAI_API_KEY is valid, then inspect the uploaded Codex artifact and action logs."
          exit 1

      - name: Run post-change tests
        run: uv run --frozen --group dev pytest

      - name: Write workflow summary
        if: always()
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          {
            echo '## Codex final message'
            echo
            printf '%s\n' "$CODEX_FINAL_MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture patch artifact
        if: always()
        run: |
          git status --short
          git diff --binary > /tmp/codex.diff || true

      - name: Upload Codex artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: codex-autopilot-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            /tmp/codex-output.md
            /tmp/codex.diff

      # The agent runs unsupervised with contents:write and pull-requests:write.
      # Nothing else in this repo gates a workflow diff: there is no CODEOWNERS,
      # and every autopilot PR carries the same generic title, so a reviewer
      # skimming "Autopilot maintenance" has no signal that the diff loosened
      # the very permissions and secrets usage that constrain the agent. Workflow
      # files are therefore reverted here AND excluded from add-paths below --
      # belt and braces, because add-paths alone would leave the edits sitting
      # dirty in the workspace where a later step could stage them.
      - name: Drop agent edits to CI/CD workflow files
        id: workflow_guard
        run: |
          set -uo pipefail
          changed=$(git status --porcelain -- .github/workflows | sed 's/^...//' | sort -u)
          if [ -z "$changed" ]; then
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          echo "::warning::Codex modified .github/workflows; those changes were reverted and excluded from the PR."
          printf '%s\n' "$changed"
          git checkout -- .github/workflows 2>/dev/null || true
          git clean -fd -- .github/workflows 2>/dev/null || true
          {
            echo '## Workflow edits dropped'
            echo
            echo 'Codex modified these workflow files. They were reverted; propose them in a human-authored PR instead.'
            echo
            printf '%s\n' "$changed" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CODEX_PR_TOKEN || github.token }}
          commit-message: 'chore(codex): autopilot maintenance'
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: codex/autopilot
          delete-branch: true
          title: ${{ steps.workflow_guard.outputs.attempted == 'true' && '[Codex] Autopilot maintenance (workflow edits dropped - review)' || '[Codex] Autopilot maintenance' }}
          body: |
            This pull request was opened automatically by the Codex autopilot workflow.

            ${{ steps.workflow_guard.outputs.attempted == 'true' && '> **This run tried to edit CI/CD workflow files.** Those edits were reverted and are NOT in this diff; the run summary lists them. Read the run log before merging, and raise any wanted workflow change as a human-authored PR.' || '' }}

            - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Prompt file: `.github/codex/prompts/autobuild.md`
            - Guidance files: `AGENTS.md` and `.agents/skills/regengine-api-contract/SKILL.md`
            - Transcript + patch: download the workflow artifact from this run
            - Merge policy: this workflow only opens or updates a PR. A human review
              and required status checks must land the change.
          # Deliberately NOT `.github/**`: that let agent-authored changes to
          # .github/workflows/** ride along in a PR titled "Autopilot
          # maintenance". Everything under .github that the agent legitimately
          # maintains is listed individually; workflow and composite-action
          # definitions are not, and are reverted by the guard step above.
          add-paths: |
            .github/codex/**
            .github/dependabot.yml
            .agents/**
            .codex/**
            AGENTS.md
            AUTOPILOT_TASKS.md
            PROMPT_FOR_CODEX.md
            README.md
            app/**
            tests/**
            pyproject.toml
            uv.lock
