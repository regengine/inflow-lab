name: Remote Browser Smoke

on:
  schedule:
    - cron: '47 10 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed shared-demo base URL
        required: false
        type: string
        default: https://regengine-inflow-lab-gh-production.up.railway.app
      tenant:
        description: Tenant used for isolated remote browser smoke data
        required: false
        type: string
        default: remote-browser-smoke

permissions:
  contents: read

concurrency:
  group: remote-browser-smoke-${{ github.event.inputs.base_url || 'https://regengine-inflow-lab-gh-production.up.railway.app' }}-${{ github.event.inputs.tenant || 'remote-browser-smoke-nightly' }}
  cancel-in-progress: false

jobs:
  remote-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev --group browser
          uv run --frozen --no-dev --group browser playwright install --with-deps chromium

      - name: Validate remote browser smoke secrets
        env:
          REGENGINE_REMOTE_USERNAME: ${{ secrets.REGENGINE_REMOTE_USERNAME }}
          REGENGINE_REMOTE_PASSWORD: ${{ secrets.REGENGINE_REMOTE_PASSWORD }}
        run: |
          test -n "$REGENGINE_REMOTE_USERNAME" || { echo "REGENGINE_REMOTE_USERNAME secret is required"; exit 1; }
          test -n "$REGENGINE_REMOTE_PASSWORD" || { echo "REGENGINE_REMOTE_PASSWORD secret is required"; exit 1; }

      - name: Run remote browser smoke
        env:
          REGENGINE_BROWSER_BASE_URL: ${{ github.event.inputs.base_url || 'https://regengine-inflow-lab-gh-production.up.railway.app' }}
          REGENGINE_BROWSER_USERNAME: ${{ secrets.REGENGINE_REMOTE_USERNAME }}
          REGENGINE_BROWSER_PASSWORD: ${{ secrets.REGENGINE_REMOTE_PASSWORD }}
          REGENGINE_BROWSER_TENANT: ${{ github.event.inputs.tenant || 'remote-browser-smoke-nightly' }}
          REGENGINE_BROWSER_EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: uv run --frozen --no-dev --group browser python scripts/browser_smoke.py

      # browser_smoke.py writes output/playwright/browser_smoke_failure.png on
      # any failure. Without this the screenshot dies with the runner, and a
      # nightly failure against the shared demo has to be reproduced locally to
      # see what Playwright actually saw.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: remote-browser-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  # A red scheduled run is invisible; a filed issue is not. See
  # .github/workflows/smoke-failure-issue.yml.
  report-failure:
    needs: remote-browser-smoke
    if: failure()
    uses: ./.github/workflows/smoke-failure-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      smoke_name: Remote Browser Smoke
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The other edge. Without it the tracker's open/closed state carries no
  # information about whether the demo is broken *now*, and the next real
  # outage lands as a comment on a stale thread instead of a new issue.
  report-recovery:
    needs: remote-browser-smoke
    if: success()
    uses: ./.github/workflows/smoke-failure-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      smoke_name: Remote Browser Smoke
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      resolved: true
