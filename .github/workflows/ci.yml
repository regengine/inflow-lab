name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        # Upgrade pip alongside uv. pip-audit below scans the ambient
        # environment, so a stale runner pip fails this job for a vulnerability
        # in a build tool that is not a project dependency. Upgrading it fixes
        # that at the source; the alternative is a standing --ignore-vuln per
        # advisory, which red-lines every PR until someone adds the next one.
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run --frozen --group dev pytest

      - name: Check dependency health
        run: |
          uv pip check
          # No --ignore-vuln entries. The previous one suppressed PYSEC-2026-196
          # against the runner's bundled pip 26.1.1 "until the runner image
          # ships pip >= 26.1.2". It duly did — and PYSEC-2026-3721 then landed
          # against 26.1.2, failing this job on an unrelated docs commit. That
          # is the treadmill an ignore list creates. The install step upgrades
          # pip instead, so the scan sees a current build tool and this gate
          # reflects project dependencies, which is what it is for.
          uv run --frozen --group dev pip-audit
          uv run --frozen --group dev bandit -q -r app scripts

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev --group browser
          uv run --frozen --no-dev --group browser playwright install --with-deps chromium

      - name: Run browser smoke
        run: uv run --frozen --no-dev --group browser python scripts/browser_smoke.py
