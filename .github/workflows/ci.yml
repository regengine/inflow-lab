name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Every `uses:` below is pinned to a commit SHA with the release in a trailing
# comment; .github/dependabot.yml keeps those pins fresh. Do not replace one
# with a bare tag - a retagged upstream release would change what runs here.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade uv

      # Run through `uvx <tool>@<version>` rather than the dev dependency
      # group: neither tool is imported by the app, and keeping them out of
      # uv.lock leaves `uv pip check` / pip-audit reasoning about runtime
      # dependencies only. Both versions are pinned so an upstream release
      # cannot turn CI red on its own. Rule selection and scope live in
      # pyproject.toml ([tool.ruff], [tool.mypy]).
      - name: Ruff
        run: uvx ruff@0.15.8 check --output-format=github .

      - name: Mypy
        run: uvx mypy@1.19.1

      # No package.json, no ESLint: the operator console is a single vanilla
      # script served straight from app/static. node --check is the gate that
      # needs no toolchain and no config, and it catches the failure that
      # actually breaks the dashboard -- a syntax error that only shows up when
      # a browser parses the file. node is preinstalled on ubuntu-latest.
      - name: Check operator console JavaScript parses
        run: |
          for file in app/static/*.js; do
            echo "node --check $file"
            node --check "$file"
          done

  # NOTE ON THE JOB NAME: branch protection requires a status check named
  # exactly `pytest`. A `strategy.matrix` renames the checks it produces to
  # `pytest (3.11)` / `pytest (3.12)`, so the required `pytest` check is never
  # reported and stays permanently "expected" -- which blocks every merge in the
  # repo with "2 of 2 required status checks have not succeeded". The 3.12
  # coverage added in #126 therefore lives in a SEPARATE job below rather than
  # in a matrix over this one. Do not convert this job to a matrix, and do not
  # rename it or `browser-smoke` (also required) without updating branch
  # protection first.
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # 3.11 is the floor declared in pyproject.toml.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py3.11-

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run --frozen --group dev pytest

      - name: Check dependency health
        # Runs here and only here; the lock is universal, not per-interpreter,
        # so a second pass on 3.12 would audit the same resolution twice.
        run: |
          uv pip check
          # No --ignore-vuln entries. pip is a real locked dependency of this
          # project, not an ambient build tool: pip-audit -> pip-api -> pip, in
          # the dev group. So an advisory against it is fixed the same way as
          # any other — bump it in uv.lock (uv lock --upgrade-package pip).
          # The suppression this replaced pinned its own expiry to the runner
          # image shipping a newer pip, which was never going to clear it.
          uv run --frozen --group dev pip-audit
          uv run --frozen --group dev bandit -q -r app scripts

  # 3.12 is what the Dockerfile (and therefore the Railway deploy) actually
  # runs, so a 3.12-only failure must not reach production first (#126). Kept
  # as its own job rather than a matrix leg -- see the note on `pytest` above.
  # Deliberately NOT required by branch protection: it is the same suite on a
  # second interpreter, and the required set is `pytest` + `browser-smoke`.
  pytest-py312:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-py3.12-

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run --frozen --group dev pytest

  # #104: the only test that exercises the real wire between this simulator and
  # RegEngine lives in RegEngine's repo, checked out at a hardcoded
  # INFLOW_LAB_REF that nothing advances and nothing fails when it drifts. This
  # is the inflow-lab half of the fix -- it fails HERE when that pin falls
  # behind, so drift surfaces on an inflow-lab PR instead of silently.
  #
  # WHAT IT ACTUALLY GATES TODAY: without REGENGINE_CONTRACT_REPO_TOKEN the job
  # can only run the #140 staleness guard, and it passes. Configure that secret
  # (a token with read access to the RegEngine repo) to turn on the two checks
  # that matter -- pin drift and the required-KDE comparison against RegEngine's
  # own table. Expect the drift check to be RED the first time it runs: main is
  # already well past the pinned SHA, and clearing it needs the RegEngine-side
  # change (advance INFLOW_LAB_REF, or track main) that this repo cannot make.
  # That red is the finding, not a broken job.
  contract-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Measuring drift means counting commits since the pinned SHA, which
          # a shallow clone does not contain.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check out RegEngine, if a cross-repo token is configured
        id: regengine
        env:
          REGENGINE_TOKEN: ${{ secrets.REGENGINE_CONTRACT_REPO_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${REGENGINE_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REGENGINE_CONTRACT_REPO_TOKEN is not set, so only the pin staleness guard runs. Pin drift and the upstream required-KDE comparison are NOT being checked."
            exit 0
          fi
          git clone --quiet --depth 1 \
            "https://x-access-token:${REGENGINE_TOKEN}@github.com/${{ github.repository_owner }}/RegEngine.git" \
            "${RUNNER_TEMP}/regengine"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Contract pin check
        run: |
          if [ "${{ steps.regengine.outputs.available }}" = "true" ]; then
            uv run --frozen --group dev python scripts/contract_pin_check.py \
              --regengine-path "${RUNNER_TEMP}/regengine"
          else
            uv run --frozen --group dev python scripts/contract_pin_check.py
          fi

  # Railway builds this Dockerfile fresh on every deploy, so without this job
  # production is the first place it is ever built. A bad COPY path or a
  # 3.12-only import error would pass every other job green.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build the image Railway deploys
        run: docker build --tag inflow-lab:ci .

      - name: Boot the image and probe /api/healthz
        # The image sets REGENGINE_REQUIRE_AUTH=1, so it refuses to start
        # without credentials — passing throwaway ones here exercises that
        # fail-closed startup path as well as the entrypoint and gosu drop.
        run: |
          docker run --detach --name inflow-lab-ci \
            --publish 8000:8000 \
            --env REGENGINE_BASIC_AUTH_USERNAME=ci \
            --env REGENGINE_BASIC_AUTH_PASSWORD=ci-not-a-real-secret \
            inflow-lab:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/healthz > /tmp/healthz.json; then
              cat /tmp/healthz.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs inflow-lab-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs inflow-lab-ci || true

      - name: Stop the container
        if: always()
        run: docker rm --force inflow-lab-ci || true

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Cache uv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev --group browser
          uv run --frozen --no-dev --group browser playwright install --with-deps chromium

      - name: Run browser smoke
        run: uv run --frozen --no-dev --group browser python scripts/browser_smoke.py

      # browser_smoke.py writes output/playwright/browser_smoke_failure.png on
      # any failure. Without this the screenshot dies with the runner and the
      # failure has to be reproduced locally to see what Playwright saw.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
