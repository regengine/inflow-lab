# Keeps the commit-SHA pins in .github/workflows/*.yml current (see #130).
#
# Every `uses:` in this repo's workflows is pinned to a full commit SHA with
# a trailing `# vX.Y.Z` comment. Dependabot's github-actions ecosystem
# understands that convention: when an action cuts a new release, it opens a
# PR that updates both the SHA and the version comment together, so the pins
# don't quietly rot into permanently-stale versions just because they can no
# longer float on their own.
#
# `directory: "/"` is not a typo for a repo-root scan of app code — for the
# github-actions ecosystem this tells Dependabot where to start looking for
# workflow files, and it always checks `.github/workflows/` from there,
# which covers all 5 workflow files in this repo.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
